[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gazetteer"
version = "0.1.0"
description = "Bounded structural queries for huge directory trees"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "click>=8.1",
]

[project.scripts]
gaz = "gazetteer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gazetteer"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
