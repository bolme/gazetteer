[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaz"
version = "0.1.1"
description = "Bounded structural queries for huge directory trees"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/bolme/gazetteer"
Repository = "https://github.com/bolme/gazetteer"
Issues = "https://github.com/bolme/gazetteer/issues"

[project.scripts]
gaz = "gazetteer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
preview = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "python-docx>=1.0",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gazetteer"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
