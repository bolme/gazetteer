[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaz"
version = "0.1.4"
description = "Bounded structural queries for huge directory trees"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["filesystem", "cli", "du", "find", "disk-usage", "duplicates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/bolme/gazetteer"
Repository = "https://github.com/bolme/gazetteer"
Issues = "https://github.com/bolme/gazetteer/issues"

[project.scripts]
gaz = "gazetteer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
preview = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "python-docx>=1.0",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gazetteer"]

# Spelled out rather than left to "everything not gitignored": that
# default silently shipped local editor/tool config (.claude/) into the
# sdist. An explicit list means a new dotfile directory can't leak.
[tool.hatch.build.targets.sdist]
include = [
    "src/gazetteer",
    "tests",
    "skills",
    "scripts",
    "README.md",
    "DESIGN.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "TODO.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
